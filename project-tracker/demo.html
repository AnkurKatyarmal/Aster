<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Tracker — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- SheetJS — reads/writes the .xlsx import/export template -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- ================= AUTH SCREENS (unused here — this page always runs local/demo mode) ================= -->
<div id="authScreen" class="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">Ankur's</div>
    <div class="auth-logo-sub">Project Tracker</div>
    <div id="authScreenBody"></div>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div class="app-shell" id="appShell" style="display:none;">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">Ankur's</div>
      <div class="sidebar-brand-sub">Project Tracker — Demo</div>
    </div>
    <ul class="nav-list">
      <li class="nav-item" data-page="dashboard"><span class="nav-icon">▦</span><span class="nav-label">Dashboard</span></li>
      <li class="nav-item" data-page="projects"><span class="nav-icon">▤</span><span class="nav-label">Projects</span></li>
      <li class="nav-item" data-page="kanban"><span class="nav-icon">▥</span><span class="nav-label">Kanban</span></li>
      <li class="nav-item" data-page="timeline"><span class="nav-icon">⟿</span><span class="nav-label">Timeline</span></li>
      <li class="nav-item" data-page="analytics"><span class="nav-icon">◎</span><span class="nav-label">Analytics</span></li>
      <li class="nav-item" data-page="risks"><span class="nav-icon">⚠</span><span class="nav-label">Risks</span></li>
      <li class="nav-item" data-page="reports"><span class="nav-icon">⤓</span><span class="nav-label">Reports</span></li>
      <li class="nav-item nav-approvals" data-page="approvals" style="display:none;">
        <span class="nav-icon">☑</span><span class="nav-label">Approvals</span>
        <span class="nav-badge" id="pendingChangeBadge" style="display:none;">0</span>
      </li>
      <li class="nav-item nav-admin-only" data-page="access" style="display:none;">
        <span class="nav-icon">✓</span><span class="nav-label">Access Requests</span>
        <span class="nav-badge" id="pendingUserBadge" style="display:none;">0</span>
      </li>
      <li class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></li>
    </ul>
    <div class="sidebar-footer" id="sidebarFooter">Demo mode — sample data, stored only in your browser</div>
  </aside>

  <div class="main-column">
    <div class="topbar">
      <div class="topbar-search page-search-row" style="display:none;">
        <input type="text" id="globalSearch" placeholder="Search by client, project, module, owner, environment…">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnThemeToggle" title="Toggle dark mode">🌙</button>
        <div id="topbarUser" class="topbar-user" style="display:none;"></div>
        <button class="btn btn-primary" id="btnAddProject">+ Add Project</button>
      </div>
    </div>
    <main id="mainContent"></main>
  </div>

</div>

<!-- Modal -->
<div id="modalBackdrop">
  <div class="modal-panel">
    <div id="modalContent"></div>
  </div>
</div>

<!-- Drawer -->
<div id="drawerBackdrop">
  <div class="drawer-panel">
    <div id="drawerContent"></div>
  </div>
</div>

<!-- Hidden import input, used by Settings page -->
<input type="file" id="importFileInput" accept="application/json" style="display:none;">
<input type="file" id="importExcelInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
<button id="btnExport" style="display:none;"></button>
<button id="btnImport" style="display:none;"></button>
<button id="btnDownloadTemplate" style="display:none;"></button>
<button id="btnDownloadExcelTemplate" style="display:none;"></button>
<button id="btnImportExcel" style="display:none;"></button>
<button id="btnResetSample" style="display:none;"></button>
<button id="btnClearAll" style="display:none;"></button>

<script src="js/firebase-config.js"></script>
<script>
  // This page is a public, no-login DEMO — it always runs in local mode,
  // regardless of the real Firebase project configured in
  // js/firebase-config.js for the main (signed-in) tracker. Data lives only
  // in each visitor's own browser (localStorage) and is pre-seeded with the
  // built-in sample projects — nobody sharing this link ever sees or
  // touches real client data, and nothing they do here is visible to
  // anyone else. Safe to share with anyone.
  window.FIREBASE_ENABLED = false;
</script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/kanban.js"></script>
<script src="js/timeline.js"></script>
<script src="js/risks.js"></script>
<script src="js/analytics.js"></script>
<script src="js/reports.js"></script>
<script src="js/poc-templates.js"></script>
<script src="js/excel-import.js"></script>
<script src="js/app.js"></script>
</body>
</html>
