<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDfy Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">IDfy</div>
      <div class="sidebar-brand-sub">Project Tracker</div>
    </div>
    <ul class="nav-list">
      <li class="nav-item" data-page="dashboard"><span class="nav-icon">▦</span><span class="nav-label">Dashboard</span></li>
      <li class="nav-item" data-page="projects"><span class="nav-icon">▤</span><span class="nav-label">Projects</span></li>
      <li class="nav-item" data-page="kanban"><span class="nav-icon">▥</span><span class="nav-label">Kanban</span></li>
      <li class="nav-item" data-page="timeline"><span class="nav-icon">⟿</span><span class="nav-label">Timeline</span></li>
      <li class="nav-item" data-page="analytics"><span class="nav-icon">◎</span><span class="nav-label">Analytics</span></li>
      <li class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></li>
    </ul>
    <div class="sidebar-footer">Data stored locally in this browser</div>
  </aside>

  <div class="main-column">
    <div class="topbar">
      <div class="topbar-search page-search-row" style="display:none;">
        <input type="text" id="globalSearch" placeholder="Search by client, project, module, owner, environment…">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btnAddProject">+ Add Project</button>
      </div>
    </div>
    <main id="mainContent"></main>
  </div>

</div>

<!-- Modal -->
<div id="modalBackdrop">
  <div class="modal-panel">
    <div id="modalContent"></div>
  </div>
</div>

<!-- Drawer -->
<div id="drawerBackdrop">
  <div class="drawer-panel">
    <div id="drawerContent"></div>
  </div>
</div>

<!-- Hidden import input, used by Settings page -->
<input type="file" id="importFileInput" accept="application/json" style="display:none;">
<button id="btnExport" style="display:none;"></button>
<button id="btnImport" style="display:none;"></button>
<button id="btnResetSample" style="display:none;"></button>
<button id="btnClearAll" style="display:none;"></button>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/kanban.js"></script>
<script src="js/timeline.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
